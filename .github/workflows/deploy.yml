name: Deploy to EC2

# Runs on every push to main. The EC2 instance is normally stopped between
# demos (see deploy/aws-stop.sh) to conserve the AWS credit, so this job
# starts it first if needed, waits until it's reachable, then SSHes in and
# runs deploy/deploy.sh on the box itself.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Start instance if stopped, wait for SSH
        id: start
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          chmod +x deploy/aws-start.sh
          IP=$(./deploy/aws-start.sh)
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.EC2_SSH_USER }}
          HOST: ${{ steps.start.outputs.ip }}
        run: |
          install -m 600 -D /dev/null ~/.ssh/deploy_key
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key \
            "$SSH_USER@$HOST" 'bash ~/achat/deploy/deploy.sh'
