# Reverse proxy for the achat app container (FastAPI, serving the built React
# SPA itself -- see backend/app/app.py's FRONTEND_DIST). nginx's only job here
# is TLS termination + forwarding to the container on 127.0.0.1:7860.
#
# DOMAIN is a placeholder -- replace every occurrence with your real free
# subdomain (e.g. achat.duckdns.org) before running certbot. See
# deploy/SETUP.md step 4.

server {
    listen 80;
    server_name DOMAIN;

    # certbot's webroot plugin drops its ACME challenge files here to prove
    # domain ownership before it will issue a certificate
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # everything else redirects to HTTPS once the certificate exists;
    # certbot --nginx (see SETUP.md) rewrites this block automatically on
    # first run, so this plain HTTP-only version is only live before that
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name DOMAIN;

    # certbot --nginx fills these in and manages renewal; placeholder paths
    # so the config is valid nginx syntax even before the cert exists
    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;

    # SSE streaming (the token-by-token /generate response) needs these three
    # settings specifically -- nginx buffers and chunks responses by default,
    # which would turn a smooth token stream into bursts arriving in batches
    location / {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # disables nginx's response buffering so SSE chunks reach the
        # browser as the app writes them, not once a buffer fills
        proxy_buffering off;
        proxy_cache off;

        # generation can legitimately run for tens of seconds; without this
        # nginx's default 60s read timeout would cut a long reply off mid-stream
        proxy_read_timeout 300s;

        # WebSocket upgrade headers -- harmless if unused today, but Vite's
        # dev HMR and any future websocket use need them, and there's no
        # downside to having them in an SSE-only proxy
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
